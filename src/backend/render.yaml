# render.yaml
# Render IaC config: declares the web service.
# Render reads this file automatically when the repository is connected.
#
# NOTE: This project uses Supabase for PostgreSQL (not Render's built-in DB).
#       Set DATABASE_URL manually in the Render dashboard using your
#       Supabase connection string.

services:
  - type: web
    name: finsight-api
    runtime: python
    pythonVersion: "3.12"
    rootDir: src/backend

    # Install Python dependencies
    buildCommand: pip install -r requirements.txt

    # Start the FastAPI app on the port Render assigns via $PORT
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      # Supabase PostgreSQL connection string.
      # Get it from: Supabase Dashboard → Project Settings → Database → URI
      # Format: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

      # Comma-separated list of allowed CORS origins.
      # Set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

    autoDeploy: true
