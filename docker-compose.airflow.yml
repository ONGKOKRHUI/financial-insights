# docker-compose.airflow.yml
#
# Standalone Airflow stack for FinSight ETL pipeline.
# Uses LocalExecutor — no Redis/Celery required.
# Runs Airflow's own metadata on a SEPARATE postgres (port 5433)
# so it never touches the main finsight database (port 5432).
#
# Prerequisites:
#   1. Copy .env.example → .env and fill in all AI / DB / Airflow keys.
#   2. Start the main stack first (docker compose up -d) for the finsight DB.
#   3. Then start Airflow:  docker compose -f docker-compose.airflow.yml up --build
#
# Airflow UI: http://localhost:8080  (user: admin / password: admin)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    # Airflow metadata DB — points to the dedicated postgres-airflow container
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-finsight-airflow-secret}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-HnvohNQlq8zydPYxPVvA6x0f0l4CYwSqNMOYfTRtFjY=}

    # ── AI & pipeline env vars forwarded from .env ──────────────────────────
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    PIPELINE_ENGINE: ${PIPELINE_ENGINE:-langgraph}

    # ── Dify (optional) ──────────────────────────────────────────────────────
    DIFY_API_URL: ${DIFY_API_URL:-}
    DIFY_API_KEY: ${DIFY_API_KEY:-}

    # ── finsight app DB — used by the loader ─────────────────────────────────
    # Prefer AIRFLOW_DATABASE_URL for local Airflow container connectivity.
    # Falls back to DATABASE_URL for compatibility, then to service-name based local default.
    DATABASE_URL: ${AIRFLOW_DATABASE_URL:-${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/finsight}}

    # ── PDF input directory (inside the container) ───────────────────────────
    FINSIGHT_RAW_DIR: /app/src/scraper/data/raw

    # ── Python path so DAG can import pipeline.* and db.* ────────────────────
    PYTHONPATH: /app/src

  volumes:
    - ./dags:/opt/airflow/dags              # DAG files
    - ./src:/app/src                        # pipeline + db source
    - ./logs/airflow:/opt/airflow/logs      # Airflow task logs
    - airflow_plugins:/opt/airflow/plugins
    # Mount scraper data so Airflow can see downloaded PDFs
    - ./src/scraper/data:/app/src/scraper/data

  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # ── Airflow metadata database (isolated from finsight DB) ─────────────────
  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5433:5432"   # exposed on 5433 to avoid conflict with main postgres
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot init: create DB schema and admin user ─────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@finsight.local \
          --password admin
    restart: "no"

  # ── Web UI ─────────────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Scheduler ─────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_airflow_data:
  airflow_plugins:
