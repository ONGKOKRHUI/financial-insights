name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - src/backend/**
      - .github/workflows/deploy-backend.yml

  workflow_dispatch:

jobs:
  deploy:
    name: Validate & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt

      - name: Validate backend imports
        working-directory: ./src/backend
        run: |
          python -m compileall .
          python -c "from main import app; print('Backend imports OK')"

      - name: Trigger Render deploy hook
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"
